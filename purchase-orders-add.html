<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Purchase Order | Great Solomon SCIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=3" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-on-background min-h-screen">
  <div class="max-w-4xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <p class="text-sm font-medium text-primary">Purchase Orders</p>
        <h1 class="text-3xl font-headline font-bold">Create Purchase Order</h1>
      </div>
      <a href="purchase-orders.html" class="btn-secondary">Back</a>
    </div>

    <form id="poForm" class="space-y-6 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Vendor</span>
          <input name="vendor" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Supplier name" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Vendor ID</span>
          <input name="vendor_id" type="number" min="1" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Optional" />
        </label>

        <label class="space-y-2 md:col-span-2">
          <span class="text-sm font-medium text-on-surface">Items</span>
          <textarea name="items" rows="4" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Describe the purchased items"></textarea>
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Total Amount</span>
          <input name="total" type="number" min="0" step="0.01" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="50000" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Expected Delivery</span>
          <input name="expected_delivery" type="date" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
        </label>

        <label class="space-y-2 md:col-span-2">
          <span class="text-sm font-medium text-on-surface">Notes</span>
          <textarea name="notes" rows="3" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Optional notes"></textarea>
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
        <a href="purchase-orders.html" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Create PO</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('poForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const form = event.currentTarget;
      const payload = Object.fromEntries(new FormData(form).entries());

      const response = await fetch('/api/v1/pos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (!response.ok) {
        alert(result.error || 'Failed to create purchase order');
        return;
      }

      alert(`Purchase order created successfully: ${result.po_number || 'PO'}`);
      window.location.href = 'purchase-orders.html';
    });
  </script>
</body>
</html>
