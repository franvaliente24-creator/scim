<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Asset | Great Solomon SCIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=6" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-on-background min-h-screen">
  <div class="max-w-4xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <p class="text-sm font-medium text-primary">Inventory</p>
        <h1 class="text-3xl font-headline font-bold">Add Asset</h1>
      </div>
      <a href="inventory.html" class="btn-secondary">Back</a>
    </div>

    <form id="assetForm" class="space-y-6 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">QR Code</span>
          <input name="qr_code" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="QR-LAP-001" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Asset Name</span>
          <input name="name" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Laptop" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Category</span>
          <input name="category" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="IT Equipment" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Value</span>
          <input name="value" type="number" min="0" step="0.01" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="45000" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Status</span>
          <select name="status" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            <option value="In Warehouse">In Warehouse</option>
            <option value="Deployed">Deployed</option>
            <option value="In Maintenance">In Maintenance</option>
          </select>
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Location</span>
          <input name="location" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Warehouse A" />
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
        <a href="inventory.html" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Save Asset</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('assetForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const form = event.currentTarget;
      const payload = Object.fromEntries(new FormData(form).entries());

      const response = await fetch('/api/v1/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (!response.ok) {
        alert(result.error || 'Failed to create asset');
        return;
      }

      alert('Asset created successfully');
      window.location.href = 'inventory.html';
    });
  </script>
</body>
</html>
