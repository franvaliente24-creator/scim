<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Document | Great Solomon SCIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=3" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-on-background min-h-screen">
  <div class="max-w-4xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <p class="text-sm font-medium text-primary">Documents & Logistics</p>
        <h1 class="text-3xl font-headline font-bold">Add Document</h1>
      </div>
      <a href="documents.html" class="btn-secondary">Back</a>
    </div>

    <form id="documentForm" class="space-y-6 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Document Type</span>
          <select name="document_type" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            <option value="Invoice">Invoice</option>
            <option value="Receipt">Receipt</option>
            <option value="Contract">Contract</option>
            <option value="EAF">EAF</option>
            <option value="Permit">Permit</option>
          </select>
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Owner</span>
          <input name="owner" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Operations Team" />
        </label>

        <label class="space-y-2 md:col-span-2">
          <span class="text-sm font-medium text-on-surface">Description</span>
          <textarea name="description" rows="4" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Document details"></textarea>
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Related PO</span>
          <input name="related_po" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="PO-2026-001" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Due Date</span>
          <input name="due_date" type="date" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
        <a href="documents.html" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Save Document</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('documentForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const form = event.currentTarget;
      const payload = Object.fromEntries(new FormData(form).entries());

      const response = await fetch('/api/v1/documents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (!response.ok) {
        alert(result.error || 'Failed to create document');
        return;
      }

      alert(`Document created successfully: ${result.reference_no || 'DOC'}`);
      window.location.href = 'documents.html';
    });
  </script>
</body>
</html>
