<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Asset | Great Solomon SCIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=5" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-on-background min-h-screen">
  <div class="max-w-4xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <p class="text-sm font-medium text-primary">Inventory</p>
        <h1 class="text-3xl font-headline font-bold">Edit Asset</h1>
      </div>
      <a href="inventory.html" class="btn-secondary">Back</a>
    </div>

    <form id="editAssetForm" class="space-y-6 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <label class="space-y-2 md:col-span-2">
          <span class="text-sm font-medium text-on-surface">QR Code</span>
          <input id="qr_code" name="qr_code" required maxlength="50" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Name</span>
          <input id="name" name="name" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Category</span>
          <input id="category" name="category" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Status</span>
          <select id="status" name="status" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            <option value="In Warehouse">In Warehouse</option>
            <option value="Deployed">Deployed</option>
            <option value="In Maintenance">In Maintenance</option>
          </select>
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Value</span>
          <input id="value" name="value" type="number" min="0" step="0.01" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
        </label>

        <label class="space-y-2 md:col-span-2">
          <span class="text-sm font-medium text-on-surface">Location</span>
          <input id="location" name="location" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
        <a href="inventory.html" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Update Asset</button>
      </div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const qrCode = params.get('qr');

    async function loadAsset() {
      if (!qrCode) {
        alert('Missing asset QR code in the page URL.');
        window.location.href = 'inventory.html';
        return;
      }

      const response = await fetch(`/api/v1/inventory/assets/${encodeURIComponent(qrCode)}`);
      const asset = await response.json();
      if (!response.ok || !asset || asset.error) {
        alert(asset?.error || 'Asset not found');
        window.location.href = 'inventory.html';
        return;
      }

      document.getElementById('qr_code').value = asset.qr_code;
      document.getElementById('name').value = asset.name || '';
      document.getElementById('category').value = asset.category || '';
      document.getElementById('status').value = asset.status || 'In Warehouse';
      document.getElementById('value').value = asset.value || 0;
      document.getElementById('location').value = asset.location || '';
    }

    document.getElementById('editAssetForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const payload = Object.fromEntries(form.entries());

      const response = await fetch(`/api/v1/inventory/assets/${encodeURIComponent(qrCode)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      if (!response.ok) {
        alert(result.error || 'Failed to update asset');
        return;
      }

      alert('Asset updated successfully');
      window.location.href = 'inventory.html';
    });

    loadAsset();
  </script>
</body>
</html>
