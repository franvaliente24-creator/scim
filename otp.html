<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Identity | Great Solomon SCIM</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css?v=6">
    <link rel="stylesheet" href="auth.css?v=2">
</head>
<body class="login-page">
    <main class="auth-card">
        <!-- Company Logo -->
        <div class="company-logo">
            <div class="logo-icon">
                <img src="img/logo.png" alt="Great Solomon Logo" class="w-full h-full object-contain">
            </div>
        </div>
        
        <h1>Verify your identity</h1>
        <p class="auth-subtitle">We've sent a 6-digit verification code to your email.</p>
        
        <form id="otpForm" novalidate>
            <!-- Six digit input boxes -->
            <div class="otp-boxes" id="otpBoxes">
                <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
                <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
            </div>
            
            <p class="otp-expiry">
                <span class="material-symbols-outlined">schedule</span>
                Code expires in <span id="otpCountdown" class="font-bold">5:00</span>
            </p>
            
            <p id="otpError" class="login-error" role="alert"></p>
            
            <button class="signin-button" type="submit">Verify Code</button>
            
            <div class="mt-5 text-center space-y-2">
                <p class="text-sm text-slate-500">
                    Didn't receive the code? <a href="#" class="resend-otp text-indigo-600 font-semibold hover:text-indigo-800">Resend code</a>
                </p>
                <a href="login.html" class="back-to-login inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700">
                    <span class="material-symbols-outlined text-base">arrow_back</span>
                    Back to Login
                </a>
            </div>
        </form>
    </main>
    
    <script src="token.js?v=1"></script>
    <script src="otp.js?v=2"></script>
</body>
</html>
