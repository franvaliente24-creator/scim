<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Requisition | Great Solomon SCIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=3" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-on-background min-h-screen">
  <div class="max-w-4xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <p class="text-sm font-medium text-primary">Procurement</p>
        <h1 class="text-3xl font-headline font-bold">Create Requisition</h1>
      </div>
      <a href="procurement.html" class="btn-secondary">Back</a>
    </div>

    <form id="requisitionForm" class="space-y-6 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Title</span>
          <input name="title" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Office Laptop Upgrade" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Department</span>
          <input name="department" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="IT / Operations" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Priority</span>
          <select name="priority" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Urgent">Urgent</option>
          </select>
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Estimated Cost</span>
          <input name="estimated_cost" type="number" min="0" step="0.01" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="250000" />
        </label>

        <label class="space-y-2 md:col-span-2">
          <span class="text-sm font-medium text-on-surface">Description</span>
          <textarea name="description" rows="4" required class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="Describe the requested item or service"></textarea>
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Needed By</span>
          <input name="needed_by" type="date" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
        </label>

        <label class="space-y-2">
          <span class="text-sm font-medium text-on-surface">Status</span>
          <select name="status" class="w-full px-4 py-3 border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            <option value="Draft">Draft</option>
            <option value="Submitted">Submitted</option>
            <option value="Pending Quote">Pending Quote</option>
            <option value="Under Review">Under Review</option>
          </select>
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
        <a href="procurement.html" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Create Requisition</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('requisitionForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const form = event.currentTarget;
      const payload = Object.fromEntries(new FormData(form).entries());

      const response = await fetch('/api/v1/procurement/requisitions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (!response.ok) {
        alert(result.error || 'Failed to create requisition');
        return;
      }

      alert(`Requisition created successfully: ${result.req_number || 'REQ'}`);
      window.location.href = 'procurement.html';
    });
  </script>
</body>
</html>
