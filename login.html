<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Great Solomon SCIM</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css?v=9">
    <link rel="stylesheet" href="auth.css?v=2">
</head>
<body class="login-page">
    <main class="auth-card">
        <!-- Company Logo Only -->
        <div class="company-logo">
            <div class="logo-icon">
                <img src="img/logo.png" alt="Great Solomon Logo" class="w-full h-full object-contain">
            </div>
        </div>
        
        <h1>Sign In</h1>
        <p class="auth-subtitle">Great Solomon Manpower Services, Inc.</p>
        
        <form id="loginForm" novalidate>
            <label>Email Address
                <span class="field">
                    <span class="material-symbols-outlined">email</span>
                    <input name="email" type="email" placeholder="you@company.com" autocomplete="email" required>
                </span>
            </label>
            
            <label>Password
                <span class="field">
                    <span class="material-symbols-outlined">lock</span>
                    <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" id="togglePassword" class="show-password" aria-label="Show password">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </span>
            </label>
            
            <div class="auth-options">
                <label class="remember">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#" id="forgotPassword">Forgot password?</a>
            </div>
            
            <p id="loginError" class="login-error" role="alert"></p>
            
            <button class="signin-button" type="submit">Sign In</button>
        </form>
    </main>
    
    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="auth-modal-backdrop hidden">
        <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="forgotTitle">
            <div style="width:56px;height:56px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
                <span class="material-symbols-outlined" style="color:#4f46e5;font-size:28px;">lock_reset</span>
            </div>
            <h2 id="forgotTitle">Reset Your Password?</h2>
            <p>Password resets must be authorized by an administrator. Would you like to notify the Administrator to update your credentials?</p>
            <input type="email" id="forgotEmail" placeholder="Your account email" style="width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;margin-bottom:6px;">
            <p id="forgotStatus" style="min-height:18px;font-size:13px;"></p>
            <div style="display:flex;gap:10px;">
                <button type="button" id="forgotModalClose" style="flex:1;background:#f1f5f9;color:#334155;">Cancel</button>
                <button type="button" id="forgotModalSend" style="flex:1;">Notify Admin</button>
            </div>
        </div>
    </div>
    
    <!-- Permissions System -->
    <script src="token.js?v=1"></script>
    <script src="permissions.js?v=9"></script>
    <script src="login.js?v=7"></script>
</body>
</html>
